# Nginx site for ahmad-zaven.io (static portfolio)
# Install:  /etc/nginx/sites-available/ahmad-zaven.io  +  symlink into sites-enabled
# HTTPS is added afterwards by:  sudo certbot --nginx -d ahmad-zaven.io -d www.ahmad-zaven.io --redirect
server {
    listen 80;
    listen [::]:80;
    server_name ahmad-zaven.io www.ahmad-zaven.io;

    root /var/www/ahmad-zaven.io/current;
    index index.html;

    access_log /var/log/nginx/ahmad-zaven.io.access.log;
    error_log  /var/log/nginx/ahmad-zaven.io.error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml application/manifest+json;

    # Screenshots and icons: cache for 30 days
    location ~* \.(?:jpe?g|png|webp|avif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # index.html must never be cached, or visitors keep seeing the old version after a deploy
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ^~ /.well-known/acme-challenge/ { allow all; }
    location ~ /\.(?!well-known) { deny all; }

    # One-page site: real files only, everything else gets the 404 page
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
